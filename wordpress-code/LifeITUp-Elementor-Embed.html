<div id="lifeitup-embed-container" style="width: 100%; min-height: 850px; background-color: #FAF6EE; display: flex; justify-content: center; align-items: flex-start; padding: 0; margin: 0; box-sizing: border-box;">
  <iframe 
    id="lifeitup-live-frame"
    src="https://lifeitup.vercel.app" 
    style="width: 100%; max-width: 680px; height: 920px; border: none; outline: none; background-color: #FAF6EE; display: block; margin: 0 auto; overflow: hidden;"
    allow="clipboard-write; autoplay; fullscreen"

<script>
(function() {
  // Listen for dynamic resize events from Vercel app if emitted
  window.addEventListener("message", function(e) {
    if (e.data && (e.data.type === "SET_HEIGHT" || e.data.height)) {
      var h = e.data.height || e.data.value;
      var frame = document.getElementById("lifeitup-live-frame");
      if (frame && h > 400) {
        frame.style.height = (h + 30) + "px";
      }
    }
  });
})();
</script>

<!-- =========================================================================
     LIFEITUP 2-MINUTE WELLBEING CHECK — 100% RESPONSIVE DESKTOP + MOBILE EMBED
     Paste directly into WordPress Elementor "HTML" Widget
     ========================================================================= -->

<div id="lifeitup-desktop-wrapper" style="width: 100%; min-height: 100vh; background-color: #FAF6EE; margin: 0; padding: 0; overflow: hidden; display: flex; justify-content: center; align-items: stretch;">
  <iframe 
    id="lifeitup-frame"
    src="https://lifeitup.vercel.app" 
    style="width: 100%; min-width: 100%; height: 100vh; min-height: 900px; border: none; outline: none; display: block; margin: 0; padding: 0; background-color: #FAF6EE;"
    allow="clipboard-write; autoplay; fullscreen"
    loading="eager">
  </iframe>
</div>

<style>
  /* Remove theme margins/paddings around the embed for full-screen desktop view */
  .elementor-widget-html,
  .elementor-widget-html .elementor-widget-container {
    width: 100% !important;
    height: 100% !important;
    margin: 0 !important;
    padding: 0 !important;
  }
  @media (min-width: 768px) {
    #lifeitup-desktop-wrapper, #lifeitup-frame {
      min-height: 950px !important;
      height: 100vh !important;
    }
  }
</style>

<script>
  // Ensure iframe adjusts if mobile browser dynamic address bar changes
  window.addEventListener("message", function(e) {
    if (e.data && e.data.height) {
      var frame = document.getElementById("lifeitup-frame");
      if (frame && e.data.height > 600) {
        frame.style.height = e.data.height + "px";
      }
    }
  });
</script>
